[project]
name = "funlab-auth"
version = "0.2.7"
description = "A funlab-flaskr plugin provide authentication mechenism."
authors = [{ name = "SunnyLin", email = "013.lin@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3.0,<2",
    "requests>=2.31.0,<3",
    "bcrypt>=4.1.2,<5",
    "flask-wtf>=1.2.1,<2",
    "pydantic>=2.12,<3",
    "funlab-flaskr",
]

[project.urls]
Repository = "https://github.com/sunnylin13/funlab-auth"

[project.entry-points."funlab_plugin"]
AuthView = "funlab.auth.view:AuthView"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-cov>=7.1.0,<8",
]

# Cross-repo dependencies resolve via the workspace root's [tool.uv.sources];
# member-level sources are intentionally omitted (each repo is its own git root,
# so `workspace = true` here would bind to this repo, not the outer workspace).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package (shared 'funlab' namespace).
packages = ["funlab"]

# AuthView must load at startup: it calls register_routes() (registers the auth
# blueprint), register_login_handler() (installs flask-login's @user_loader), and
# setup_menus() (adds Settings/Logout to the user menu).
# Without this, flask-login redirects every @login_required page to a 404.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.funlab_plugin_metadata.AuthView]
load_mode = "startup"
provides_security = true
